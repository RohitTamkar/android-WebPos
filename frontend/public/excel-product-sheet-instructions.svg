<svg xmlns="http://www.w3.org/2000/svg" width="2288" height="700" viewBox="0 0 2288 700" role="img" aria-labelledby="title description">
<title id="title">Product CSV sheet format and instructions</title>
<desc id="description">Columns: Product Name | Regional Name | Default Price | Price 1 | MRP Price | Purchase Price | Category Name | Category No | Tax | Barcode | Unit Type | Stock | Weightable | Search Code. Sample: AFGHANI TAND | AFGHANI TAND | 500 | 500 | 0 | 0 | TANDDOR STASTER | 1 | 0 | 0 | number | 0 | no | 1. File format: CSV (.csv). All 14 base columns are mandatory. Numeric fields may contain zero where applicable. Category Name and Category No must match the existing category master. Tax value 0 is present in the supplied sample. Weightable uses the supplied yes/no format. Do not treat identical product names alone as duplicates when Search Codes differ. Premises 1–5 belong to the optional premises workflow and are not part of the basic 14-column preview.</desc>
