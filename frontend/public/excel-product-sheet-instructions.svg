<text x="24" y="282" font-size="24" font-weight="600" fill="#193454">Sheet instructions</text>
<text x="24" y="322" font-size="20" fill="#334155">1. File format: CSV (.csv).</text>
<text x="24" y="366" font-size="20" fill="#334155">2. All 14 base columns are mandatory.</text>
<text x="24" y="410" font-size="20" fill="#334155">3. Numeric fields may contain zero where applicable.</text>
<text x="24" y="454" font-size="20" fill="#334155">4. Category Name and Category No must match the existing category master.</text>
<text x="24" y="498" font-size="20" fill="#334155">5. Tax value 0 is present in the supplied sample.</text>
<text x="24" y="542" font-size="20" fill="#334155">6. Weightable uses the supplied yes/no format.</text>
<text x="24" y="586" font-size="20" fill="#334155">7. Do not treat identical product names alone as duplicates when Search Codes differ.</text>
<text x="24" y="630" font-size="20" fill="#334155">8. Premises 1–5 belong to the optional premises workflow and are not part of the basic 14-column preview.</text>
