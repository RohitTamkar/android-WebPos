<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web POS - Terminal Login</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-surface: #111827;
      --bg-card: rgba(17, 24, 39, 0.85);
      --border: #1f2937;
      --border-focus: #3b82f6;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-glow: rgba(59, 130, 246, 0.25);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.12) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.1) 0%, transparent 40%),
                  var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* Top bar info */
    .top-status-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 15, 25, 0.7);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-secondary);
      z-index: 50;
    }

    .status-left, .status-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .badge-online {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      font-weight: 600;
      font-size: 12px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    /* Login Box Container */
    .login-wrapper {
      width: 100%;
      max-width: 480px;
      margin-top: 36px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                  0 0 0 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      position: relative;
    }

    /* Header */
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      color: white;
      box-shadow: 0 8px 16px var(--primary-glow);
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }

    .brand-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* Register / Terminal Selector */
    .terminal-select-group {
      margin-bottom: 20px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .terminal-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .terminal-select {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .terminal-select option {
      background: var(--bg-surface);
      color: var(--text-primary);
    }

    /* Tab switcher */
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(15, 23, 42, 0.8);
      padding: 4px;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .auth-tab {
      background: transparent;
      border: none;
      padding: 10px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .auth-tab.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    /* PIN Panel */
    .pin-display-wrapper {
      margin-bottom: 20px;
      text-align: center;
    }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 12px 0;
    }

    .pin-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .pin-dot.filled {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 12px var(--primary);
      transform: scale(1.15);
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 320px;
      margin: 0 auto;
    }

    .num-key {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 20px;
      font-weight: 700;
      height: 58px;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      user-select: none;
    }

    .num-key:hover {
      background: rgba(51, 65, 85, 0.8);
      border-color: var(--border-focus);
      transform: translateY(-2px);
    }

    .num-key:active {
      transform: scale(0.96);
    }

    .num-key.action-key {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      background: rgba(15, 23, 42, 0.4);
    }

    /* Password / Form View */
    .form-view {
      display: none;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-field {
      width: 100%;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .input-toggle-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .input-toggle-btn:hover {
      color: var(--text-primary);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    /* Notification message */
    .alert-banner {
      display: none;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      align-items: center;
      gap: 8px;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    /* Quick Demo Logins */
    .demo-accounts {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .demo-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-align: center;
    }

    .demo-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .demo-chip {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .demo-chip:hover {
      background: rgba(59, 130, 246, 0.15);
      border-color: var(--primary);
      color: var(--text-primary);
    }

    /* Logged in Welcome Modal / Screen */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .welcome-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .welcome-avatar {
      width: 64px;
      height: 64px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
  </style>
</head>
<body>

  <!-- Top status bar -->
  <div class="top-status-bar">
    <div class="status-left">
      <span class="badge-online"><span class="dot"></span> POS Core Online</span>
      <span id="pos-terminal-name">Register #01</span>
    </div>
    <div class="status-right">
      <span id="live-clock">12:00:00 PM</span>
    </div>
  </div>

  <!-- Login Container -->
  <div class="login-wrapper">
    <div class="brand-header">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
      </div>
      <h1 class="brand-title">Web POS Terminal</h1>
      <p class="brand-subtitle">Point of Sale & Register Access</p>
    </div>

    <!-- Terminal Selection -->
    <div class="terminal-select-group">
      <span class="terminal-label">Terminal</span>
      <select id="terminal-select" class="terminal-select">
        <option value="REG-01">Register 01 (Main Counter)</option>
        <option value="REG-02">Register 02 (Express Checkout)</option>
        <option value="REG-03">Register 03 (Drive-Thru / Takeout)</option>
      </select>
    </div>

    <!-- Alerts -->
    <div id="alert-banner" class="alert-banner"></div>

    <!-- Tab switcher -->
    <div class="auth-tabs">
      <button id="tab-pin" class="auth-tab active" onclick="switchTab('pin')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        Cashier PIN
      </button>
      <button id="tab-pass" class="auth-tab" onclick="switchTab('pass')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        Manager / Admin
      </button>
    </div>

    <!-- PIN Numpad View -->
    <div id="pin-view">
      <div class="pin-display-wrapper">
        <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Enter 4-Digit Security PIN</div>
        <div class="pin-dots">
          <div class="pin-dot" id="dot-0"></div>
          <div class="pin-dot" id="dot-1"></div>
          <div class="pin-dot" id="dot-2"></div>
          <div class="pin-dot" id="dot-3"></div>
        </div>
      </div>

      <div class="keypad-grid">
        <button class="num-key" onclick="pressNum('1')">1</button>
        <button class="num-key" onclick="pressNum('2')">2</button>
        <button class="num-key" onclick="pressNum('3')">3</button>
        <button class="num-key" onclick="pressNum('4')">4</button>
        <button class="num-key" onclick="pressNum('5')">5</button>
        <button class="num-key" onclick="pressNum('6')">6</button>
        <button class="num-key" onclick="pressNum('7')">7</button>
        <button class="num-key" onclick="pressNum('8')">8</button>
        <button class="num-key" onclick="pressNum('9')">9</button>
        <button class="num-key action-key" onclick="clearPin()">CLEAR</button>
        <button class="num-key" onclick="pressNum('0')">0</button>
        <button class="num-key action-key" onclick="backspacePin()">⌫</button>
      </div>

      <button class="btn-submit" onclick="submitPinLogin()">
        Log In to Register
      </button>
    </div>

    <!-- Form / Password View -->
    <div id="form-view" class="form-view">
      <form onsubmit="handlePasswordLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">Username or Email</label>
          <div class="input-wrapper">
            <input type="text" id="username" class="input-field" placeholder="manager or admin" required autocomplete="username" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="input-field" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="input-toggle-btn" onclick="togglePasswordVisibility('password')">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit">
          Sign In
        </button>
      </form>
    </div>

    <!-- Quick Demo Accounts -->
    <div class="demo-accounts">
      <div class="demo-title">Quick Demo Logins</div>
      <div class="demo-chips">
        <button class="demo-chip" onclick="quickFill('cashier')">Cashier (PIN: 1234)</button>
        <button class="demo-chip" onclick="quickFill('manager')">Manager (manager123)</button>
        <button class="demo-chip" onclick="quickFill('admin')">Admin (admin123)</button>
      </div>
    </div>
  </div>

  <!-- Success / Session Modal -->
  <div id="welcome-modal" class="modal-overlay">
    <div class="welcome-card">
      <div class="welcome-avatar">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <h2 style="font-size: 22px; margin-bottom: 8px;" id="welcome-user">Welcome, Cashier!</h2>
      <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 20px;" id="welcome-detail">Session started on Register 01</p>
      <div style="background: rgba(30, 41, 59, 0.5); padding: 14px; border-radius: var(--radius-md); font-size: 13px; text-align: left; margin-bottom: 20px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
          <span style="color: var(--text-muted);">Role</span>
          <span style="font-weight: 600;" id="modal-role">Cashier</span>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
          <span style="color: var(--text-muted);">Terminal ID</span>
          <span style="font-weight: 600;" id="modal-terminal">REG-01</span>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <span style="color: var(--text-muted);">Shift Status</span>
          <span style="color: var(--success); font-weight: 600;">Active</span>
        </div>
      </div>
      <button class="btn-submit" onclick="closeModal()">
        Open POS Dashboard
      </button>
    </div>
  </div>

  <script>
    let currentPin = '';
    const maxPinLength = 4;

    // Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Terminal Selector change
    document.getElementById('terminal-select').addEventListener('change', (e) => {
      document.getElementById('pos-terminal-name').textContent = e.target.options[e.target.selectedIndex].text.split('(')[0].trim();
    });

    // Tab switcher
    function switchTab(mode) {
      const pinTab = document.getElementById('tab-pin');
      const passTab = document.getElementById('tab-pass');
      const pinView = document.getElementById('pin-view');
      const formView = document.getElementById('form-view');
      hideAlert();

      if (mode === 'pin') {
        pinTab.classList.add('active');
        passTab.classList.remove('active');
        pinView.style.display = 'block';
        formView.style.display = 'none';
      } else {
        passTab.classList.add('active');
        pinTab.classList.remove('active');
        pinView.style.display = 'none';
        formView.style.display = 'block';
      }
    }

    // PIN handlers
    function pressNum(num) {
      if (currentPin.length < maxPinLength) {
        currentPin += num;
        renderPinDots();
        if (currentPin.length === maxPinLength) {
          setTimeout(submitPinLogin, 200);
        }
      }
    }

    function clearPin() {
      currentPin = '';
      renderPinDots();
      hideAlert();
    }

    function backspacePin() {
      currentPin = currentPin.slice(0, -1);
      renderPinDots();
    }

    function renderPinDots() {
      for (let i = 0; i < maxPinLength; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i < currentPin.length) {
          dot.classList.add('filled');
        } else {
          dot.classList.remove('filled');
        }
      }
    }

    // Keyboard support for PIN
    window.addEventListener('keydown', (e) => {
      if (document.getElementById('pin-view').style.display !== 'none') {
        if (/^[0-9]$/.test(e.key)) {
          pressNum(e.key);
        } else if (e.key === 'Backspace') {
          backspacePin();
        } else if (e.key === 'Escape') {
          clearPin();
        }
      }
    });

    function showAlert(msg, isError = true) {
      const alert = document.getElementById('alert-banner');
      alert.style.display = 'flex';
      alert.className = `alert-banner ${isError ? 'alert-error' : 'alert-success'}`;
      alert.textContent = msg;
    }

    function hideAlert() {
      const alert = document.getElementById('alert-banner');
      alert.style.display = 'none';
    }

    function togglePasswordVisibility(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function submitPinLogin() {
      const terminal = document.getElementById('terminal-select').value;
      if (currentPin === '1234') {
        showSuccessModal('Cashier (Alex Rivera)', 'Cashier', terminal);
      } else if (currentPin === '9999') {
        showSuccessModal('Store Manager (Sarah Connor)', 'Manager', terminal);
      } else {
        showAlert('Invalid PIN. Use demo PIN 1234 or 9999.');
        clearPin();
      }
    }

    function handlePasswordLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const terminal = document.getElementById('terminal-select').value;

      if (username === 'manager' && password === 'manager123') {
        showSuccessModal('Manager (Sarah Connor)', 'Store Manager', terminal);
      } else if (username === 'admin' && password === 'admin123') {
        showSuccessModal('Admin (Root)', 'System Admin', terminal);
      } else {
        showAlert('Invalid credentials. Demo: manager / manager123 or admin / admin123');
      }
    }

    function quickFill(role) {
      if (role === 'cashier') {
        switchTab('pin');
        currentPin = '1234';
        renderPinDots();
        setTimeout(submitPinLogin, 300);
      } else if (role === 'manager') {
        switchTab('pass');
        document.getElementById('username').value = 'manager';
        document.getElementById('password').value = 'manager123';
        showAlert('Credentials loaded. Click "Sign In" or press Enter.', false);
      } else if (role === 'admin') {
        switchTab('pass');
        document.getElementById('username').value = 'admin';
        document.getElementById('password').value = 'admin123';
        showAlert('Admin credentials loaded. Click "Sign In" or press Enter.', false);
      }
    }

    function showSuccessModal(name, role, terminal) {
      hideAlert();
      document.getElementById('welcome-user').textContent = `Welcome, ${name}!`;
      document.getElementById('welcome-detail').textContent = `Session authenticated for ${terminal}`;
      document.getElementById('modal-role').textContent = role;
      document.getElementById('modal-terminal').textContent = terminal;
      document.getElementById('welcome-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('welcome-modal').style.display = 'none';
      // In SPA or full app, navigate to root or dashboard
      if (window.location.pathname.includes('login.html')) {
        window.location.href = '/';
      }
    }
  </script>
</body>
</html>
